    RiskAssessmentAllow:
      summary: Низкий риск, операция разрешена (фикстура канона §10.1)
      description: |
        Эталонный happy-path шага 16 канона §6. Соответствует фикстуре прототипа:
        `riskScore` = 17, полоса `LOW`, решение `ALLOW`. `caseId` и `slaHours` равны
        `null` — кейс не создаётся. Цепочка продолжается на шаг 17 (баланс).
      value:
        assessmentId: rsk_01J9X4D8Q3S5V7X9Z1B3D5F7H9
        userId: usr_01J8ZQ4H9K2M3N4P5R6S7T8V9W
        operationType: EXCHANGE
        score: 17
        riskBand: LOW
        decision: ALLOW
        caseId: null
        slaHours: null
        decidedAt: 2026-08-07T10:15:32.117Z
        ttlSeconds: 300
        expiresAt: 2026-08-07T10:20:32.117Z
        policyVersion: 4.12.0
        modelVersion: aml-gbm-2026.07.3
        reasons:
          - Aggregate risk score below ALLOW threshold for TIER_2
        factors:
          - code: NEW_DEVICE
            weight: 12
            severity: LOW
            description: Device fingerprint first seen 2 hours ago
          - code: GEO_MISMATCH
            weight: 5
            severity: LOW
            description: IP geolocation AE matches residency AE, minor ASN deviation

    RiskAssessmentReview:
      summary: Требуется ручная проверка → SCORING_REVIEW_REQUIRED (202), НЕ ошибка
      description: |
        Соответствует сценарному переключателю прототипа `SCORING_REVIEW` (канон §10.6).
        Exchange BFF создаёт заявку в статусе `MANUAL_REVIEW`, **резервирует средства**
        и возвращает `202` с телом заявки. Пользователь видит `Sent for manual review`.
        Поля `caseId` и `slaHours` заполнены.
      value:
        assessmentId: rsk_01J9X4D8Q3S5V7X9Z1B3D5F7H9
        userId: usr_01J8ZQ4H9K2M3N4P5R6S7T8V9W
        operationType: EXCHANGE
        score: 68
        riskBand: HIGH
        decision: REVIEW
        caseId: cas_01J9X5E9R4T6W8Y0A2C4E6G8J0
        slaHours: 24
        decidedAt: 2026-08-07T10:15:32.117Z
        ttlSeconds: 300
        expiresAt: 2026-08-07T10:20:32.117Z
        policyVersion: 4.12.0
        modelVersion: aml-gbm-2026.07.3
        reasons:
          - Velocity pattern consistent with structuring, manual review required
        factors:
          - code: STRUCTURING_PATTERN
            weight: 34
            severity: HIGH
            description: Five transactions just below the reporting threshold within 48 hours
          - code: VELOCITY_ANOMALY
            weight: 21
            severity: MEDIUM
            description: Daily volume is 4.2x the 30-day median
          - code: NEW_DEVICE
            weight: 13
            severity: LOW
            description: Device fingerprint first seen 20 minutes ago

    RiskAssessmentDeny:
      summary: Операция запрещена → SCORING_DENIED (403)
      description: |
        Заявка **не создаётся**. Пользователю показывается только
        `Operation declined. Contact support.` — ни `factors`, ни `reasons`, ни `score`
        наружу не транслируются: раскрытие сработавших правил помогает обходить AML-контур.
