openapi: 3.1.0

info:
  title: Exchange Rate Service (S5) — Inbound Contract Stub
  version: "1.0.0"
  summary: Котировки валютных пар, TTL, источник цены, признак stale и здоровье источников.
  description: |
    # Назначение

    Это **стаб внешнего сервиса S5 «Exchange Rate Service»**. Контракт описывает
    **входящую к нам информацию**: что именно наше приложение (**Exchange BFF**) получает
    от поставщика котировок. Сам сервис мы **не реализуем** — он принадлежит смежной
    команде. Файл фиксирует форму данных, семантику устаревания, коды ошибок и правила
    деградации, на которые опирается BFF.

    Источник истины по доменным именам, деньгам, направлению курса, порядку валидации,
    каталогу ошибок и фикстурам — `docs/00-canonical-model.md` (далее «канон»).
    Расхождение с каноном = дефект контракта.

    # Что мы получаем

    * **Котировки** (`GET /v1/rates`, `GET /v1/rates/{pairId}`) — `bid`, `ask`, `mid`,
      применяемый `rate`, обратный курс для отображения, спред, точность, источник,
      время котировки, TTL, признаки `stale` / `degraded` и уровень доверия.
    * **Здоровье источников цены** (`GET /v1/sources`) — статус, момент последнего
      успешного опроса, доля ошибок, задержка p95. Используется дежурной сменой и
      для решения «доверять ли текущей котировке».
    * **Поток тиков** по WebSocket — описан ниже в разделе «WebSocket-канал тиков»,
      потому что OpenAPI не выражает потоковые каналы.

    Сервис **только читающий**. Все HTTP-эндпоинты — идемпотентные `GET`, ретраи
    разрешены, но ограничены жёстким бюджетом времени (см. ниже).

    # Направление курса (канон §5.2) — читать обязательно

    `rate` = сколько единиц **`toAsset`** даётся за **1 единицу `fromAsset`**.

    Пример из канона: пара `RUB→USDT`, `rate = "0.010638297872"`, что читается человеком
    как «1 USDT = 94.00 RUB». Поле `inverseRate` (`"94.00"`) существует **только для
    отображения** и округляется `ROUND_HALF_UP` до 2 знаков (канон §5.4).
    В расчётах `inverseRate` **запрещено** использовать: `toAmountRaw = netFromAmount × rate`.

    Пары **односторонние**: `RUB→USDT` и `USDT→RUB` котируются независимо и не связаны
    соотношением `1/rate` — заложенный спред это демонстрирует (канон §10.3).

    # Критичность (канон §3)

    Класс критичности — **Blocking**. Без котировки заявка не создаётся: пользователю
    возвращается `RATE_SERVICE_UNAVAILABLE` (503). Смягчение — только короткое окно
    отдачи устаревших данных, описанное ниже.

    # Таймауты и ретраи (канон §11)

    | Параметр | Значение |
    |---|---|
    | Таймаут одного вызова | **800 мс** — пользователь ждёт котировку синхронно |
    | Ретраи | **2 попытки**, экспоненциальный backoff + jitter (разрешено: только `GET`) |
    | Circuit breaker | порог 50 % ошибок на окне 20 запросов, open 30 с |
    | Бюджет `POST /v1/exchange-quotes` | p95 ≤ 300 мс — котировка пересчитывается на каждый ввод |
    | Дебаунс ввода на клиенте | 300 мс, чтобы не выжигать бюджет запросов |

    Таймаут S5 самый жёсткий среди всех интеграций именно потому, что он лежит на
    синхронном пути ввода суммы. Суммарное время всех попыток не должно превышать
    бюджет `POST /v1/exchange-quotes`; при исчерпании — `UPSTREAM_TIMEOUT` (504).

    # Кеширование, stale и деградация (канон §11 «Кеширование»)

    Строка канона: **курсы — TTL 1 с; отдаём с `degraded: true` до 10 с, дальше `503`**.
    Разворачивается в трёхзонную модель по возрасту котировки `staleAgeMs`:

    | Возраст котировки | `stale` | `degraded` | Поведение BFF |
    |---|---|---|---|
    | `0 … 1 000 мс` | `false` | `false` | Свежая котировка, используется как есть |
    | `1 000 … 10 000 мс` | `true` | `true` | Используется, но котировка помечается `degraded: true` |
    |  |  |  | (канон §4.3) и в UI показывается индикатор устаревания |
    | `> 10 000 мс` | `true` | `true` | **Не используется.** Наружу `RATE_SERVICE_UNAVAILABLE` (503) |

    Клиент может сузить допуск параметром `maxStalenessMs`: сервис не вернёт котировку
    старше указанного возраста и отдаст вместо неё ошибку `RATE_STALE`.
    Верхняя граница параметра — `10000`, потому что дальше решение всё равно
    предопределено каноном.

    Ключ кеша — `pairId`. Кеш **не персональный** и не содержит PII, поэтому разделяется
    между всеми пользователями.

    # Дрейф курса (канон §11)

    Порог дрейфа — **0.20 %**. При подтверждении заявки BFF повторно запрашивает курс
    (шаг 10 цепочки валидации) и сравнивает его с `rate`, зафиксированным в котировке:

    ```
    drift = |rateNow − rateQuoted| / rateQuoted × 100
    drift > 0.20 %  →  RATE_CHANGED (409, retryable, баннер «Rate changed. Calculation updated.»)
    ```

    Порог выбран как компромисс: меньше — пользователя дёргает рыночный шум,
    больше — систему несёт валютный риск.

    # Поведение при недоступности

    1. **Таймаут / сетевой отказ / 5xx** → берём последнюю котировку из кеша.
       Если её возраст ≤ 10 с, отдаём с `degraded: true`; иначе — отказ.
    2. **Кеш пуст или котировка старше 10 с** → `RATE_SERVICE_UNAVAILABLE` (503).
    3. **`PAIR_NOT_QUOTED`** → `PAIR_NOT_SUPPORTED` (422), не retryable: это доменный
       факт, а не сбой.
    4. **Circuit breaker open** → исходящих вызовов нет, сразу шаг 1.
    5. **Отказ WebSocket-потока** → переход на polling REST с интервалом 1 с; котировки
       помечаются `degraded: true` до восстановления потока.

    Сценарный переключатель прототипа `RATES_DOWN` (канон §10.6) воспроизводит именно
    исход 2, `RATE_DRIFT` — исход из раздела «Дрейф курса».

    # Где используется в цепочке валидации (канон §6)

    | Шаг | Проверка | Что берём из S5 |
    |---|---|---|
    | **6** | Котировка существует → `QUOTE_NOT_FOUND` (404) | `GET /v1/rates/{pairId}` при построении котировки |
    | **10** | Курс не уехал за порог 0.20 % → `RATE_CHANGED` (409) | повторный `GET /v1/rates/{pairId}` при подтверждении |

    # Деньги, курсы и проценты

    Все курсы, суммы и процентные величины передаются **строками** с десятичной записью
    (канон §5.1). Двоичные `float`/`double` запрещены на всём пути. Регулярное выражение
    валидации: `^(0|[1-9]\d{0,18})(\.\d{1,18})?$`. Курс **не округляется** при передаче
    и хранении (канон §5.4) — округление курса ломает воспроизводимость расчёта.
    Не-денежные величины (`spreadBps`, `precision`, `ttlMs`, `sourceLatencyMs`,
    `staleAgeMs`) — целые числа, потому что деньгами не являются.

    # Время

    Все временные метки — ISO-8601 UTC с миллисекундами и суффиксом `Z`
    (например `2026-08-07T10:15:32.117Z`), канон §9. Длительности — целые миллисекунды.

    # PII

    Сервис **не обрабатывает персональные данные**: котировки одинаковы для всех
    пользователей, `userId` в запросах не передаётся, персонализации нет. Тела ответов
    можно логировать целиком и кешировать в разделяемом кеше.

    Единственное ограничение приватности — **корреляция**: `X-Correlation-Id` связывает
    запрос курса с конкретной пользовательской сессией. Поэтому связка
    «correlationId + pairId + сумма» не должна утекать в сторонние системы аналитики,
    а объём запросов по пользователю не должен использоваться для профилирования.

    # Безопасность транспорта

    Service-to-service: **mTLS** на транспорте плюс **Bearer JWT** сервисного аккаунта
    (см. `components.securitySchemes`). WebSocket-канал использует тот же токен
    в заголовке `Authorization` на этапе handshake.

    # WebSocket-канал тиков

    OpenAPI не описывает потоковые каналы, поэтому контракт потока зафиксирован здесь
    текстом и продублирован в `x-websocket-channel` на корне документа. Он **нормативен
    наравне** с REST-частью.

    ## Подключение

    * URL: `wss://rates.internal.wallet/v1/stream`
    * Подпротокол: `wallet.rates.v1` (заголовок `Sec-WebSocket-Protocol`)
    * Транспорт: TLS 1.3 + **mTLS**, клиентский сертификат обязателен
    * Аутентификация: заголовок `Authorization: Bearer <service-JWT>` **при handshake**.
      Токен в query-строке запрещён (утекает в логи прокси). Токен проверяется один раз;
      при его истечении соединение **не** разрывается — переавторизация выполняется
      кадром `{"op":"auth","token":"..."}`, который обязателен не реже чем раз в 240 с.
    * Отказ аутентификации → соединение закрывается кодом **4001** ещё до отправки
      первого кадра данных.

    ## Подписка

    Клиент отправляет:

    ```json
    {"op":"subscribe","channel":"ticks","pairs":["RUB-USDT","USDT-RUB"],"reqId":"01J9X2C4K7QF8N3M5T6V7W8Y9Z"}
    ```

    Сервер подтверждает:

    ```json
    {"op":"subscribed","channel":"ticks","pairs":["RUB-USDT","USDT-RUB"],"reqId":"01J9X2C4K7QF8N3M5T6V7W8Y9Z","ts":"2026-08-07T10:15:32.117Z"}
    ```

    Частичный успех (часть пар не котируется):

    ```json
    {"op":"subscribed","channel":"ticks","pairs":["RUB-USDT"],"rejected":[{"pair":"EUR-USDT","reason":"PAIR_NOT_QUOTED"}],"reqId":"01J9X2C4K7QF8N3M5T6V7W8Y9Z","ts":"2026-08-07T10:15:32.117Z"}
    ```

    Отписка: `{"op":"unsubscribe","channel":"ticks","pairs":["USDT-RUB"],"reqId":"..."}`
    → ответ `{"op":"unsubscribed", ...}`.

    Ошибка подписки: `{"op":"error","reqId":"...","error":"SUBSCRIPTION_LIMIT_EXCEEDED","message":"...","ts":"..."}`.

    Поле `reqId` обязательно и эхом возвращается в ответе — это единственный способ
    сопоставить ответ с запросом в дуплексном канале.

    ## Формат тика

    ```json
    {"channel":"ticks","pairId":"RUB-USDT","bid":"0.010638297872","ask":"0.010683760684","mid":"0.010661029278","rate":"0.010638297872","seq":12345,"ts":"2026-08-07T10:15:32.117Z"}
    ```

    * Все ценовые поля — **строки** (канон §5.1), даже в потоке.
    * `rate` — применяемая сторона; направление то же, что в REST (канон §5.2).
    * `ts` — момент котировки на стороне источника, ISO-8601 UTC с миллисекундами.
    * `seq` — см. следующий раздел.
    * Тик **не содержит** `stale` / `degraded`: по определению поток отдаёт свежие
      данные, а признак устаревания вычисляет клиент как `now − ts`.

    ## Heartbeat

    * Клиент отправляет `{"op":"ping","ts":"2026-08-07T10:15:32.117Z"}` **каждые 15 с**.
    * Сервер отвечает `{"op":"pong","ts":"2026-08-07T10:15:32.121Z"}`.
    * Если сервер не получил ни одного кадра от клиента **30 с** — соединение
      закрывается кодом `1001`.
    * Если клиент не получил `pong` или тик **30 с** — он обязан считать соединение
      мёртвым и переподключиться, не дожидаясь TCP-таймаута.
    * Прикладной ping/pong используется вместо контрольных кадров WebSocket намеренно:
      промежуточные L7-прокси часто отвечают на контрольные кадры сами и маскируют
      обрыв.

    ## Последовательность `seq` и ресинхронизация

    * `seq` — монотонно возрастающий счётчик **на каждую пару** (не на соединение),
      целое ≥ 1, без пропусков в нормальном режиме.
    * Клиент хранит `lastSeq[pairId]`. Разрыв (`seq > lastSeq + 1`) означает потерю
      тиков, откат (`seq ≤ lastSeq`) — дубликат или переподключение источника.
    * При **разрыве**: тик применяется, но пара помечается локально «рассинхронизирована»
      и клиент немедленно выполняет ресинхронизацию через REST —
      `GET /v1/rates/{pairId}` — и продолжает от полученного значения.
      Ресинхронизация обязана уважать общий таймаут 800 мс и не блокировать обработку
      остальных пар.
    * При **откате**: тик игнорируется как дубликат (защита от повторной доставки).
    * После реконнекта `seq` начинается заново; клиент сбрасывает `lastSeq` и делает
      первичную синхронизацию через `GET /v1/rates?pairs=...`.

    ## Backpressure и conflation

    * Канал **conflated**: если клиент читает медленнее, чем публикуется поток, сервер
      **не буферизует историю** — он хранит только **последний** тик по каждой паре и
      отдаёт именно его, когда сокет снова готов к записи. Промежуточные тики теряются
      осознанно: для расчёта котировки важна текущая цена, а не история.
    * Из-за conflation `seq` может увеличиваться скачком — это **не ошибка** и не повод
      для ресинхронизации, если возраст полученного тика в пределах допуска.
      Различить conflation и реальную потерю позволяет поле `conflated: true`,
      добавляемое сервером в тик, отданный после отставания.
    * Порог отставания: если очередь записи превышает **1 МБ** или отставание держится
      более **5 с**, соединение закрывается кодом `1013` (Try Again Later).
    * Максимальная частота публикации на пару — **10 тиков/с**; более частые обновления
      источника схлопываются сервером.

    ## Reconnect

    * Экспоненциальный backoff с полным jitter: `delay = random(0, min(30s, 500ms × 2^n))`,
      где `n` — номер неудачной попытки, начиная с 0. Верхняя граница 30 с.
    * После **успешного** соединения, прожившего дольше 60 с, счётчик `n` сбрасывается.
    * Реконнект **не выполняется** при кодах закрытия `4001` (auth) и `4003` (forbidden) —
      это конфигурационные ошибки, повтор их не исправит; событие эскалируется дежурному.
    * При коде `4029` (rate limit) первая пауза берётся не меньше значения,
      присланного в поле `retryAfterMs` кадра ошибки.
    * Пока поток не восстановлен, BFF работает на REST-polling с интервалом 1 с
      и помечает котировки `degraded: true`.

    ## Лимиты

    | Лимит | Значение |
    |---|---|
    | Пар на одно соединение | **50** |
    | Соединений на сервисный аккаунт | **20** |
    | Управляющих кадров (`subscribe`/`unsubscribe`/`auth`) | **10/с**, burst 30 |
    | Размер входящего кадра | **16 КиБ** |
    | Время жизни соединения без переавторизации | **240 с** |

    Превышение лимита пар → кадр `{"op":"error","error":"SUBSCRIPTION_LIMIT_EXCEEDED"}`
    без разрыва соединения. Превышение частоты управляющих кадров → закрытие `4029`.

    ## Коды закрытия

    | Код | Значение | Реконнект |
    |---|---|---|
    | `1000` | Нормальное закрытие по инициативе клиента | не требуется |
    | `1001` | Going Away — heartbeat не получен 30 с либо сервер уходит на деплой | да, с backoff |
    | `1011` | Внутренняя ошибка сервера | да, с backoff; учитывается circuit breaker |
    | `1013` | Try Again Later — клиент не успевает читать (backpressure) | да, с увеличенным backoff |
    | `4001` | Ошибка аутентификации: токен отсутствует, истёк или подпись неверна | **нет** |
    | `4003` | Аутентификация прошла, но доступ к каналу запрещён | **нет** |
    | `4029` | Rate limit по управляющим кадрам или по числу соединений | да, не раньше `retryAfterMs` |

  contact:
    name: Wallet Platform / Market Data Team
    email: market-data@wallet.internal
  license:
