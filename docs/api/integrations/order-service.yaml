    OrderCreateRequestRubUsdt:
      summary: Обмен 10 000 RUB → USDT по фикстурам канона §10
      description: |
        Расчёт полностью выведен из канона, шаг за шагом по §5.3 при фикстурах §10.3–§10.4
        (пара `RUB→USDT`: `rate = 0.010638297872`, `percent = 0.35`, `minFee = 10.00 RUB`,
        `min = 500.00`, `max = 1 000 000.00`):

        ```
        1. fromAmount    = "10000.00"                       (в пределах min/max §10.4)
        2. feeRaw        = 10000.00 × 0.35 / 100 = 35.00
        3. feeAmount     = clamp(35.00, 10.00, null)
                         = "35.00"                          ROUND_UP до decimals(RUB)=2
        4. netFromAmount = 10000.00 − 35.00 = "9965.00"     инвариант I1 выполнен
        5. toAmountRaw   = 9965.00 × 0.010638297872
                         = 106.010638294...
        6. toAmount      = "106.010638"                     ROUND_DOWN до decimals(USDT)=6
        ```

        `inverseRate = "94.00"` — ROUND_HALF_UP, 2 знака (§5.4), читается как
        «1 USDT = 94.00 RUB» (§10.3). `fromAmount` укладывается в доступный баланс
        `RUB = 25450.00` из §10.2 (инвариант I3, проверен в S6 на шаге 17).
        `toAsset.network = "TRON"` соответствует фикстуре §10.2.
