        Тот же `holdId`, то же тело, заголовок `Idempotency-Replayed: true`.
        Повторной блокировки средств **не произошло**: `balanceVersionBefore` и
        `balanceVersionAfter` те же, что при первом вызове. Именно это поведение
        делает безопасным повтор после ошибки на стороне пользователя.
      value:
        holdId: "hld_01J9X3D5M8RG9P4Q6T7V8W9YAB"
