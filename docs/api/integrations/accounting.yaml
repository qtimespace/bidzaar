          retryAfterMs: "200"

    ErrorHoldNotReleasable:
      summary: 409 — резерв уже исполнен, снять нельзя
      description: |
        Маппинг: `HOLD_NOT_RELEASABLE` → наш `HOLD_FAILED` (409), не retryable.
        Резерв переведён в `CAPTURED`: средства списаны окончательно, снимать нечего.
        Это состояние лежит уже за границей скоупа задания (канон §8) и на пути
        создания заявки возникать не должно — его появление означает дефект
        оркестрации.
