        details:
          idempotencyKey: "8f7d2e1a-4c5b-4d6e-9f01-2a3b4c5d6e7f"
          existingHoldId: "hld_01J9X3D5M8RG9P4Q6T7V8W9YAB"
          conflictingField: "amount"

    ErrorRequestInProgress:
      summary: 409 — запрос с этим ключом уже обрабатывается
      description: |
        Маппинг: `IDEMPOTENT_REQUEST_IN_PROGRESS` → наш `HOLD_FAILED` (409), retryable.
        Гонка: предыдущий `POST` с тем же ключом ещё в обработке.
        Действие BFF: короткая пауза, затем **сверка** через
        `GET /v1/holds?idempotencyKey=…`, а не повторный `POST`.
      value:
        error: "IDEMPOTENT_REQUEST_IN_PROGRESS"
