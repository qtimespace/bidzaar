          status: "CAPTURED"

    ErrorInsufficientFunds:
      summary: 422 — недостаточно доступного баланса
      description: |
        Маппинг: `INSUFFICIENT_AVAILABLE_BALANCE` → наш **`INSUFFICIENT_FUNDS`** (422),
        **не** retryable. Шаг 17 цепочки валидации, инвариант I3
        (`fromAmount ≤ balance.available`). Сообщение
        `Not enough RUB. Available: 25450.00`, крепится к полю «You Pay».

        Сравнение ведётся строго по `available`, не по `total` (канон §2).
