        после таймаута `POST /v1/holds`.

        Массив непуст, статус `ACTIVE` → резерв существует. BFF берёт `holdId`
        и продолжает шаг 19 (регистрация заявки). Пользователь таймаута не заметил.
        Повторять `POST` **нельзя** — это создало бы вторую блокировку.
