      description: |
        Пустой массив по тому же `idempotencyKey` → запрос до сервера не дошёл или
        не был применён. Средства не заблокированы.

        BFF возвращает наружу `HOLD_FAILED` (409, retryable), баннер
        `Could not reserve funds. Try again.`. Повторная попытка пользователя идёт
        с **тем же** `Idempotency-Key` — так гарантируется, что даже при гонке
        двойного резерва не возникнет.
      value:
        holds: []
        nextCursor: null
        hasMore: false

