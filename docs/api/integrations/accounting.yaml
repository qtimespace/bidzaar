      summary: 400 — отсутствует обязательный заголовок Idempotency-Key
      description: |
        Маппинг: `IDEMPOTENCY_KEY_MISSING` → наш `VALIDATION_ERROR` (400), не retryable.
        Это дефект BFF: канон §9 делает заголовок обязательным, и без него сверка
        после таймаута была бы невозможна.
      value:
        error: "IDEMPOTENCY_KEY_MISSING"
