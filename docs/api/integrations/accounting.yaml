        traceId: "22bb33cc44dd55ee"
        timestamp: "2026-08-07T10:15:32.117Z"
        details: null

    ErrorUnauthenticated:
      summary: 401 — сервисный токен невалиден
      description: "Маппинг: `UNAUTHENTICATED` → наш `EXCHANGE_SERVICE_UNAVAILABLE` (503)."
      value:
        error: "UNAUTHENTICATED"
        message: "Service JWT expired at 2026-08-07T10:14:00Z"
        traceId: "33cc44dd55ee66ff"
        timestamp: "2026-08-07T10:15:32.117Z"
        details: null

    ErrorForbidden:
      summary: 403 — недостаточно прав сервисного аккаунта
      description: |
        Маппинг: `FORBIDDEN` → наш `EXCHANGE_SERVICE_UNAVAILABLE` (503).
        Типичная причина — отсутствие scope `holds:write` на окружении.
      value:
        error: "FORBIDDEN"
        message: "Service account svc:exchange-bff lacks scope holds:write"
        traceId: "44dd55ee66ff7700"
        timestamp: "2026-08-07T10:15:32.117Z"
        details:
          requiredScope: "holds:write"

    ErrorWalletFrozen:
      summary: 403 — кошелёк заморожен
      description: |
        Маппинг: `WALLET_FROZEN` → наш **`WALLET_FROZEN`** (403), не retryable.
        Единственный код S6, отображающийся один-в-один. Шаг 13 цепочки валидации,
        выполняется **до** проверки баланса (Compliance First, канон §6).
        Баннер `Wallet is temporarily frozen`.
      value:
        error: "WALLET_FROZEN"
        message: "Wallet wlt_01J8ZQ5B2P4R6T8V9X0Y1Z2A3B is frozen by compliance hold"
        traceId: "55ee66ff77008811"
        timestamp: "2026-08-07T10:15:32.117Z"
        details:
          walletId: "wlt_01J8ZQ5B2P4R6T8V9X0Y1Z2A3B"
          walletStatus: "FROZEN"

    ErrorWalletUnknown:
      summary: 404 — кошелёк неизвестен сервису
      description: |
        Маппинг: `WALLET_UNKNOWN` → наш `EXCHANGE_SERVICE_UNAVAILABLE` (503).
        Пользователь прошёл аутентификацию, значит отсутствие кошелька — признак
        рассинхронизации S1 и S6, а не ошибки клиента. Событие эскалируется дежурному.
      value:
        error: "WALLET_UNKNOWN"
        message: "Wallet wlt_01J8ZQ5B2P4R6T8V9X0Y1Z2A3B does not exist"
        traceId: "66ff770088112233"
        timestamp: "2026-08-07T10:15:32.117Z"
        details:
          walletId: "wlt_01J8ZQ5B2P4R6T8V9X0Y1Z2A3B"

    ErrorAssetNotOnWallet:
      summary: 404 — актива нет на кошельке
      description: |
        Маппинг: `ASSET_NOT_ON_WALLET` → наш `ASSET_NOT_SUPPORTED` (422), не retryable.
        Сообщение `This asset is not available for exchange`, крепится к селектору.
        Не путать с нулевым балансом: нулевой `EUR` из фикстур §10.2 существует
        и возвращается как обычная строка.
      value:
        error: "ASSET_NOT_ON_WALLET"
        message: "Asset USDT@ETHEREUM is not present on wallet wlt_01J8ZQ5B2P4R6T8V9X0Y1Z2A3B"
        traceId: "770088112233aabb"
        timestamp: "2026-08-07T10:15:32.117Z"
        details:
          assetId: "USDT"
          network: "ETHEREUM"

    ErrorHoldUnknown:
      summary: 404 — резерв не найден
      description: |
        Маппинг: `HOLD_UNKNOWN` → наш `HOLD_FAILED` (409).
        **Исключение:** для компенсирующего `DELETE /v1/holds/{holdId}` этот ответ
        трактуется как **успех** — резерва нет, средства не заперты, цель достигнута.
      value:
        error: "HOLD_UNKNOWN"
        message: "Hold hld_01J9X3D5M8RG9P4Q6T7V8W9YAB does not exist"
        traceId: "88112233aabbccdd"
        timestamp: "2026-08-07T10:15:32.117Z"
        details:
          holdId: "hld_01J9X3D5M8RG9P4Q6T7V8W9YAB"

    ErrorBalanceVersionConflict:
      summary: 409 — конфликт оптимистичной блокировки
      description: |
        Маппинг: `BALANCE_VERSION_CONFLICT` → наш **`HOLD_FAILED`** (409), retryable.
        Между чтением баланса (`version: 1042`) и созданием резерва прошла
        параллельная операция, и версия стала `1044`.
        Действие BFF: перечитать баланс, сгенерировать **новый** `Idempotency-Key`
        и повторить цикл. Слепой повтор с тем же ключом даст ту же ошибку.
      value:
        error: "BALANCE_VERSION_CONFLICT"
        message: "Balance version mismatch: expected 1042, actual 1044"
        traceId: "112233aabbccddee"
        timestamp: "2026-08-07T10:15:32.117Z"
        details:
          assetId: "RUB"
          expectedBalanceVersion: "1042"
          actualBalanceVersion: "1044"

    ErrorIdempotencyConflict:
      summary: 409 — тот же ключ идемпотентности с другим телом
      description: |
        Маппинг: `HOLD_ALREADY_EXISTS_DIFFERENT_BODY` → наш **`IDEMPOTENCY_CONFLICT`**
        (409), **не** retryable, баннер `Conflicting request`.
        Канон §9: повтор с тем же телом → тот же `201`; с другим телом → `409`.
        Здесь изменилась сумма — значит это другая операция, и переиспользовать
        ключ нельзя.
      value:
        error: "HOLD_ALREADY_EXISTS_DIFFERENT_BODY"
        message: "Idempotency-Key 8f7d2e1a-4c5b-4d6e-9f01-2a3b4c5d6e7f was used with a different request body"
        traceId: "2233aabbccddeeff"
