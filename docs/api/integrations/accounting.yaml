      description: |
        `held` по строке `RUB` вырос на `10000.00`, `available` уменьшился до
        `15450.00`, `total` не изменился. Версия баланса поднялась с `1042` до `1043`.
        Дальше BFF переходит к шагу 19 — регистрации заявки в S8.
