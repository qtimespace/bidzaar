        0.010638297872 = 1/94.00` даёт `bestAsk = 94.00`. Спред 0.40 RUB на mid 93.80 —
        это 43 базисных пункта. Канон §10.3 отмечает, что спред заложен намеренно:
        он показывает, что курсы приходят из реального источника с bid/ask.
