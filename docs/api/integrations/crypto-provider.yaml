openapi: 3.1.0

info:
  title: S7 Crypto Provider API (inbound contract stub)
  version: "1.0.0"
  summary: Контракт входящих данных о ликвидности, проскальзывании и состоянии блокчейн-сетей.
  description: |
    # S7 — Crypto Provider

    ## Что это за документ

    Это **стаб контракта ВХОДЯЩЕЙ информации**. Он описывает не то, что мы реализуем,
    а то, что наше приложение — **Exchange BFF** — *получает* от внешнего криптопровайдера.
    Реализация сервиса вне нашего скоупа; здесь зафиксированы форма ответа, семантика полей,
    коды ошибок и правила деградации, на которые BFF имеет право опираться.

    ## Назначение

    Провайдер отдаёт рыночные данные с торговых площадок и телеметрию блокчейн-сетей:

    * сводку ордербука по паре (`bestBid`, `bestAsk`, `midPrice`, спред, глубина);
    * агрегированную ликвидность по площадкам;
    * оценку проскальзывания для конкретной суммы;
    * статус сетей `TRON` / `ETHEREUM` / `BITCOIN` и оценки сетевых комиссий;
    * перечень сетей, поддерживаемых конкретным активом.

    ## Критичность: Degradable (канон §3)

    S7 — **единственная система класса `Degradable`** во всей карте внешних систем.
    Правило класса из §3 канона: «Отказ → работаем на закешированных/дефолтных данных,
    помечаем котировку `degraded: true`».

    Практическое следствие, которое обязано соблюдаться реализацией BFF:

    > **При недоступности S7 котировка строится БЕЗ проверки проскальзывания,
    > помечается `degraded: true`, и заявка при этом СОЗДАЁТСЯ.**
    > Ни одна ошибка S7 не превращается в `503` для пользователя.

    ## Как данные S7 используются

    Обмен в нашем продукте **внутренний** (канон §5.5): активы перемещаются между балансами
    одного кошелька, ончейн-транзакции не выполняются, поэтому `networkFee = "0"` всегда.
    Данные S7 нужны не для расчёта сетевой комиссии, а для двух вещей:

    1. **(а) Оценка исполнимости** — понять, хватит ли на рынке ликвидности, чтобы наш
       внутренний обмен был обеспечен, и не окажется ли проскальзывание неприемлемым.
       Результат влияет только на предупреждение в котировке, но **не блокирует** заявку.
    2. **(б) Информирование пользователя о сети получения** — строка `Network` в Exchange
       Summary (`USDT@TRON`). Канон §5.5: пользователь должен осознавать выбор сети уже
       на этапе обмена, потому что при последующем выводе средств сеть определяет реальную
       стоимость.

    ## Место в цепочке валидации (канон §6)

    S7 **не является источником данных ни для одного из 19 нормативных шагов** цепочки
    валидации. Это осознанно: `Degradable`-система не может стоять на пути fail-fast-проверок.
    Вызовы S7 идут **параллельно** блокирующим проверкам и обогащают котировку:

    * рядом с шагом 5 (`PAIR_NOT_SUPPORTED`, источник S4) — S7 даёт справку о наличии рынка,
      но решение о поддержке пары принимает **S4**, а не S7;
    * рядом с шагом 10 (`RATE_CHANGED`, источник S5) — S7 даёт спред и глубину как контекст;
      сам курс и порог дрейфа 0.20 % берутся из **S5**.

    ## Таймауты и ретраи (канон §11)

    | Параметр | Значение |
    |---|---|
    | Таймаут запроса | **800–1000 мс** (нижняя граница для `orderbook-summary` и `slippage-estimate`, лежащих в бюджете котировки `p95 ≤ 300 мс`; верхняя — для справочных `GET /v1/networks`, `GET /v1/assets/{assetId}/networks`) |
    | Ретраи | только для идемпотентных `GET`: **2 попытки**, экспоненциальный backoff + jitter |
    | Circuit breaker | порог **50 % ошибок на скользящем окне 20 запросов**, состояние `open` — **30 с** |

    ### Поведение circuit breaker

    * **closed** — запросы идут в S7 нормально; счётчик считает ошибки (5xx, таймаут,
      сетевой сбой) на окне из последних 20 запросов.
    * **open** — при достижении 50 % ошибок на окне брейкер размыкается на 30 с. В течение
      этих 30 с BFF **вообще не ходит в S7**: мгновенно берёт кеш или дефолты и ставит
      `degraded: true`. Это защита от каскадного отказа (канон §11) — время ответа BFF
      не деградирует на величину таймаута S7.
    * **half-open** — по истечении 30 с пропускается один пробный запрос; успех закрывает
      брейкер, ошибка снова открывает его на 30 с.

    ## Кеш и допустимость stale

    | Данные | TTL | Допустимость stale |
    |---|---|---|
    | `orderbook-summary` | 1 с | **да**, до 10 с; дальше — работаем на дефолтах с `degraded: true` |
    | `liquidity` | 5 с | **да**, до 60 с |
    | `slippage-estimate` | 2 с (ключ кеша: `pairId` + `amount` + `side`) | **да**, до 30 с |
    | `networks`, `networks/{network}` | 30 с | **да**, до 15 мин — статус сети меняется медленно |
    | `assets/{assetId}/networks` | 5 мин (справочник, ср. §11 «Список активов и пар») | **да**, stale-while-revalidate, без ограничения по возрасту |

    Правило §11 «Курсы: отдаём с `degraded: true` до 10 с, дальше `503`» к S7 **не применяется**:
    оно относится к S5 (`Blocking`). У S7 нет исхода `503` наружу вообще.

    ## Поведение при недоступности

    | Ситуация | Реакция BFF | Что видит пользователь |
    |---|---|---|
    | Таймаут / 5xx / брейкер `open` | берём кеш; если кеша нет — дефолты (`slippagePercent = "0"`, `confidence = LOW`) | котировку с `degraded: true`, заявка **создаётся** |
    | `404 MARKET_NOT_FOUND` при живом кеше | кеш, деградация | котировку с `degraded: true` |
    | `404 MARKET_NOT_FOUND` без кеша | сигнал в оркестратор как справочный; решение о паре остаётся за **S4** (шаг 5, `PAIR_NOT_SUPPORTED`) | либо нормальную котировку, либо `PAIR_NOT_SUPPORTED` от S4 |
    | `409 INSUFFICIENT_LIQUIDITY` | **не блокирует**; в котировку добавляется warning | предупреждение, кнопка подтверждения активна |
    | `429 RATE_LIMITED` | как таймаут — деградация | котировку с `degraded: true` |

    ## PII

    **Персональных данных нет.** Все запросы обезличены: в S7 уходят только идентификаторы
    рынка/актива/сети и суммы. `userId`, `walletId`, идентификаторы устройств и любые
    контактные данные в S7 **не передаются и передаваться не должны** — суммы в связке
    с идентификатором пользователя у внешнего рыночного провайдера создают профиль торговой
    активности. Единственные сквозные заголовки — технические `X-Correlation-Id`
    и `X-Request-Id`, они не содержат PII.

